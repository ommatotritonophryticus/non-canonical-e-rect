[workspace]
resolver = "2"
members = ["erect-core", "erect-audio", "erect-desktop"]
# erect-psp is deliberately excluded: it only builds for the `mipsel-sony-psp`
# target via `cargo psp`, and having it in the workspace would break a plain
# `cargo build` on the host. Build it from inside its own directory.
exclude = ["erect-psp"]

[workspace.package]
# The one version every platform reports. erect-psp is outside the workspace and
# carries its own copy, which tools/release.sh refuses to build unless it
# matches; the Android build reads this line for the APK's version.
version = "0.3.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
